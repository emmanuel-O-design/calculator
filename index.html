<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>    
</head>
<body class="container-m"> 
    <style>
        body{
        background-image: url(./image/ChatGPT\ Image\ Aug\ 29\,\ 2026\,\ 02_59_17\ PM.png);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
         font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
         font-weight: 10;
        padding: auto; 
        }

        .calculator{
        justify-content: center;
            grid-template-columns: 4;
        }

        .number-btn{
            background-color: white;
            box-shadow: white;
            height: 100px;
            width: 100px;
            border-radius: 20px;
        }


input {
    width: 550px;
    height: 100px;
    border-radius: 50px;
    box-shadow: black;
    display: block;
    margin: 0 auto;
    font-size: 50px;
    padding-bottom: 10px;
    margin-top: 20px;
    margin-bottom: 50px;
}

.error {
    animation: shake 0.4s;
    box-shadow: 0 0 15px red, 0 0 30px red;
    border: 3px solid red;
}

.buttons.shake button {
    animation: shake 0.4s;
}
@keyframes shake {
    0% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-8px);
    }

    40% {
        transform: translateX(8px);
    }

    60% {
        transform: translateX(-6px);
    }

    80% {
        transform: translateX(6px);
    }

    100% {
        transform: translateX(0);
    }
}


    #display {
    border: 2px solid cyan;
    outline: none;
    animation: electric 1.5s infinite;
}

@keyframes electric {
    0% {
        border-color: cyan;
        box-shadow: 0 0 5px cyan;
    }

    25% {
        border-color: #00ff88;
        box-shadow: 0 0 8px #00ff88;
    }

    50% {
        border-color: #9d00ff;
        box-shadow: 0 0 5px #9d00ff;
    }

    75% {
        border-color: #ff0080;
        box-shadow: 0 0 8px #ff0080;
    }

    100% {
        border-color: cyan;
        box-shadow: 0 0 5px cyan;
    }
}

    .number-btn:hover {
    animation: buttonElectric 1.5s infinite;
}

@keyframes buttonElectric {
    0% {
        border-color: cyan;
        box-shadow: 0 0 5px cyan;
    }

    25% {
        border-color: #00ff88;
        box-shadow: 0 0 8px #00ff88;
    }

    50% {
        border-color: #9d00ff;
        box-shadow: 0 0 5px #9d00ff;
    }

    75% {
        border-color: #ff0080;
        box-shadow: 0 0 8px #ff0080;
    }

    100% {
        border-color: cyan;
        box-shadow: 0 0 5px cyan;
    }
}
    @media only screen and (max-width: 600px){
    .container-m{
        display: none !important;
    }
}
@media only screen and (min-width: 1280px){
    .row{
        display:flex;
    }  
}

    #menuBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1001;
    transition: left 0.4s ease;
    width: 40px;
    height: 40px;
    border-radius: 100px;
    background: transparent;
    border: none;
    color: white;
}

#sideMenu {
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 100vh;
    background: #000;

    transform: translateX(-100%);
    transition: transform 0.4s ease;

    z-index: 1000;
    padding-top: 80px;
}

#sideMenu a {
    display: block;
    padding: 20px;
    color: white;
}

/* OPEN */
#sideMenu.open {
    transform: translateX(0);
}

#menuBtn.open {
    left: 270px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
     width: 521px;
    margin: 0 auto;
}
 </style>

     <input type="text" class="electric-input" id="display" readonly>

  <button onclick="openEBot()">🤖 E-Bot</button>

<div class="buttons" id="calc-buttons">
    <button class="number-btn" onclick="appendvalue('1')">1</button>
    <button class="number-btn" onclick="appendvalue('2')">2</button>
    <button class="number-btn" onclick="appendvalue('3')">3</button>
    <button class="number-btn" onclick="appendvalue('4')">4</button>
    <button class="number-btn" onclick="appendvalue('5')">5</button>

    <button class="number-btn" onclick="appendvalue('6')">6</button>
    <button class="number-btn" onclick="appendvalue('7')">7</button>
    <button class="number-btn" onclick="appendvalue('8')">8</button>
    <button class="number-btn" onclick="appendvalue('9')">9</button>
    <button class="number-btn" onclick="appendvalue('0')">0</button>

    <button class="number-btn" onclick="appendvalue('.')">.</button>
    <button class="number-btn" onclick="appendvalue('+')">+</button>
    <button class="number-btn" onclick="appendvalue('-')">-</button>
    <button class="number-btn" onclick="appendvalue('*')">×</button>
    <button class="number-btn" onclick="appendvalue('/')">÷</button>

    <button class="number-btn" onclick="appendvalue('(')">(</button>
    <button class="number-btn" onclick="appendvalue(')')">)</button>
    <button class="number-btn" onclick="appendvalue('%')">%</button>
    <button class="number-btn" onclick="deletelast()">⌫</button>
    <button class="number-btn" onclick="calculate()">=</button>
</div>   
</div>
<button id="menuBtn" onclick="toggleMenu()">☰</button>

<div id="sideMenu">
    <a href="./QUIZ.html">QUIZ</a>
    <a href="./GAMES.html">🧩 GAMES</a>
    <a href="./EBOT.html">🤖 E-BOT</a>
    <a href="./SETTINGS.html">⚙ SETTINGS</a>
</div>
    <script>
        const display = document.getElementById("display")
        function deletelast(){
            display.value= display.value.slice(0,-1)
        }

        function appendvalue(value){
            display.value += value;
            display.scrollLeft = display.scrollWidth;
        }

        function cleardisply() {
            display.value = ""
        }

function calculate() {
    try {
        display.value = eval(display.value);
    } catch {
        display.value = "ERROR!";
        
        display.classList.add("error");
        document.querySelector(".buttons").classList.add("shake");

        setTimeout(function() {
       display.classList.remove("error");
       document.querySelector(".buttons").classList.remove("shake");
            display.value = "";
        }, 1500);
    }     
}

const clickSound = new Audio("./click-sound/click-sound.mp3");

document.getElementById("calc-buttons").onclick = function() {
    clickSound.play();
};

buttons.forEach(function(button) {
    button.addEventListener("click", function() {
        clickSound.currentTime = 0;
        clickSound.play();
    });
});

function toggleMenu() {
    document.getElementById("sideMenu").classList.toggle("open");
    document.getElementById("menuBtn").classList.toggle("open");
}

    function openEBot() {
    window.location.href = "ebot.html";
}
 </script>

        </body>
</html>
