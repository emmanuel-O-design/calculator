<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        .ebot-header {
            height: 80px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background: #111;
            border-bottom: 1px solid #333;
            position: relative;
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: clamp(24px, 4vw, 28px);
            cursor: pointer;
            margin-right: 20px;
            padding: 5px 10px;
            z-index: 2;
        }

        .ebot-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 4vw, 28px);
            font-weight: bold;
            white-space: nowrap;
        }

        #exited-bot {
            position: absolute;
            width: clamp(55px, 8vw, 90px);
            height: auto;
            right: 100%;
            top: 50%;
            transform: translateY(-50%);
            margin-right: 10px;
        }

        .chat-area {
            height: calc(100vh - 160px);
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: clamp(15px, 4vw, 25px);
            padding-bottom: 30px;
            scroll-behavior: smooth;
        }

        .message {
            width: fit-content;
            max-width: min(75%, 750px);
            padding: 16px 20px;
            margin-bottom: 18px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            font-size: clamp(16px, 2vw, 20px);
        }

        .bot-message {
            background: #1b1b1b;
            margin-right: auto;
            line-height: 1.8;
        }

        .user-message {
            background: #333;
            margin-left: auto;
        }

        .user-message img {
            display: block;
            max-width: min(250px, 60vw);
            max-height: 250px;
            width: auto;
            height: auto;
            border-radius: 10px;
        }

        #hello-bot {
            position: relative;
            display: block;
            width: clamp(45px, 8vw, 70px);
            height: auto;
            margin-bottom: 0px;
            left: 200px;
            left: 45%;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            min-height: 80px;
            background: #111;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            z-index: 10;
        }

        .message-input {
            flex: 1;
            min-width: 0;
            height: 45px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #222;
            color: white;
            padding: 0 18px;
            font-size: 16px;
            outline: none;
        }

        .message-input:focus {
            border-color: #777;
        }

        .action-btn {
            flex: 0 0 45px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #222;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send-btn {
            background: #555;
        }

        @media (max-width: 700px) {
            .ebot-header {
                height: 70px;
                padding: 0 10px;
            }

            .back-btn {
                margin-right: 5px;
            }

            .ebot-title {
                font-size: clamp(17px, 5vw, 22px);
            }

            #exited-bot {
                width: 50px;
                margin-right: 5px;
            }

            .chat-area {
                height: calc(100vh - 145px);
                padding: 15px 10px;
            }

            .message {
                max-width: 88%;
                padding: 12px 15px;
                margin-bottom: 12px;
                font-size: 16px;
            }

            .input-area {
                min-height: 75px;
                padding: 10px;
                gap: 6px;
            }

            .action-btn {
                flex: 0 0 40px;
                width: 40px;
                height: 40px;
                font-size: 17px;
            }

            .message-input {
                height: 40px;
                padding: 0 14px;
                font-size: 15px;
            }

            #hello-bot {
                width: 10px;
            }
        }

        @media (max-width: 450px) {
            .ebot-header {
                height: 65px;
            }

            .ebot-title {
                font-size: 17px;
            }

            #exited-bot {
                width: 42px;
                margin-right: 3px;
            }

            .back-btn {
                font-size: 23px;
                padding: 3px 5px;
            }

            .chat-area {
                height: calc(100vh - 135px);
                padding: 12px 8px;
            }

            .message {
                max-width: 92%;
                padding: 10px 12px;
                border-radius: 12px;
                font-size: 20px;
            }

            .input-area {
                min-height: 70px;
                padding: 8px;
                gap: 5px;
            }

            .action-btn {
                flex: 0 0 36px;
                width: 36px;
                height: 36px;
                font-size: 15px;
            }

            .message-input {
                height: 36px;
                padding: 0 12px;
                font-size: 14px;
            }

            #hello-bot {
                width: 45px;
            }
        }

        @media (max-width: 350px) {
            .ebot-title {
                font-size: 15px;
            }

            #exited-bot {
                width: 35px;
            }

            .message {
                max-width: 95%;
                font-size: 14px;
            }

            .input-area {
                gap: 3px;
                padding: 6px;
            }

            .action-btn {
                flex: 0 0 32px;
                width: 32px;
                height: 32px;
                font-size: 13px;
            }

            .message-input {
                height: 32px;
                font-size: 13px;
                padding: 0 9px;
            }
        }

        @media (min-width: 1200px) {
            .chat-area {
                padding-left: 8%;
                padding-right: 8%;
            }
        }
    </style>
</head>

<body>

    <header class="ebot-header">

        <button class="back-btn" onclick="goBack()">←</button>

        <div class="ebot-title">
            <img src="./image/exited-bot.jpeg" alt="" id="exited-bot">
            EPMATH-BOT
        </div>

    </header>


    <main class="chat-area" id="chatArea">

        <div class="message bot-message">
            <img src="./image/bot-hello.jpeg-removebg-preview.png" alt="" id="hello-bot">
            Hi! I'm EPM-Bot. Ask me anything about mathematics!
        </div>

    </main>


    <div class="input-area">

        <button class="action-btn" id="pictureBtn">
            📷
        </button>

        <button class="action-btn" id="micBtn">
            🎤
        </button>

        <input
            type="text"
            class="message-input"
            id="messageInput"
            placeholder="Ask a math question..."
        >

        <button
            class="action-btn send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>


<script>

function goBack() {
    window.location.href = "index.html";
}


const input = document.getElementById("messageInput");
const chatArea = document.getElementById("chatArea");
const pictureBtn = document.getElementById("pictureBtn");
const micBtn = document.getElementById("micBtn");


let conversationHistory = [];



async function sendMessage(
    question = null,
    imageData = null,
    mimeType = null
) {

    const message = question !== null
        ? question.trim()
        : input.value.trim();


    if (message === "" && !imageData) {
        return;
    }



    if (message !== "") {

        const userMessage =
            document.createElement("div");

        userMessage.className =
            "message user-message";

        userMessage.textContent = message;

        chatArea.appendChild(userMessage);
    }



    input.value = "";



    if (imageData) {

        const imageMessage =
            document.createElement("div");

        imageMessage.className =
            "message user-message";


        const img =
            document.createElement("img");


        img.src =
            "data:" +
            mimeType +
            ";base64," +
            imageData;


        img.style.maxWidth = "250px";
        img.style.maxHeight = "250px";
        img.style.borderRadius = "10px";


        imageMessage.appendChild(img);

        chatArea.appendChild(imageMessage);
    }



    const botMessage =
        document.createElement("div");

    botMessage.className =
        "message bot-message";

    botMessage.textContent =
        "🤔 E-Bot is thinking...";


    chatArea.appendChild(botMessage);

    chatArea.scrollTop =
        chatArea.scrollHeight;



    try {

        const response =
            await fetch(
                "/.netlify/functions/ask-ai",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        question: message,

                        image: imageData,

                        mimeType: mimeType,

                        history:
                            conversationHistory

                    })
                }
            );



        const data =
            await response.json();



        if (data.answer) {

            botMessage.textContent =
                data.answer;



            conversationHistory.push({

                role: "user",

                text: message,

                image:
                    imageData || null,

                mimeType:
                    mimeType || null

            });



            conversationHistory.push({

                role: "model",

                text: data.answer

            });



            if (conversationHistory.length > 10) {

                conversationHistory =
                    conversationHistory.slice(-10);

            }


        } else {

            console.error(
                "E-Bot error:",
                data
            );


            botMessage.textContent =
                "❌ Sorry, I couldn't solve that.";

        }


    } catch (error) {

        console.error(
            "Connection error:",
            error
        );


        botMessage.textContent =
            "❌ EPMATH-BOT couldn't connect right now.";

    }


    chatArea.scrollTop =
        chatArea.scrollHeight;

}



input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);



pictureBtn.addEventListener(
    "click",
    function() {

        const fileInput =
            document.createElement("input");


        fileInput.type = "file";

        fileInput.accept =
            "image/*";


        fileInput.onchange =
            function(event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }



                if (!file.type.startsWith("image/")) {

                    alert(
                        "Please select an image."
                    );

                    return;
                }



                const reader =
                    new FileReader();



                reader.onload =
                    function() {

                        const base64 =
                            reader.result
                                .split(",")[1];



                        sendMessage(

                            "Solve the math problem in this image. Show me the steps.",

                            base64,

                            file.type

                        );

                    };



                reader.readAsDataURL(file);

            };


        fileInput.click();

    }
);



const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;



if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    micBtn.addEventListener(
        "click",
        function() {

            try {

                recognition.start();

                micBtn.textContent =
                    "🔴";

                micBtn.title =
                    "Listening...";

            } catch (error) {

                console.log(
                    "Microphone already running."
                );

            }

        }
    );



    recognition.onresult =
        function(event) {

            const spokenText =
                event.results[0][0]
                    .transcript;


            input.value =
                spokenText;


            sendMessage(
                spokenText
            );

        };



    recognition.onend =
        function() {

            micBtn.textContent =
                "🎤";

            micBtn.title =
                "Voice input";

        };



    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );


            micBtn.textContent =
                "🎤";


            micBtn.title =
                "Voice input";



            if (
                event.error ===
                "not-allowed"
            ) {

                alert(
                    "Please allow microphone access for E-Bot."
                );

            }

        };


} else {

    micBtn.addEventListener(
        "click",
        function() {

            alert(
                "Voice input is not supported by this browser. Try Google Chrome or Microsoft Edge."
            );

        }
    );

}

</script>

</body>
</html>
