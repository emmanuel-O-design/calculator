<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Bot</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
        }

        .ebot-header {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            margin-right: 20px;
        }

        .ebot-title {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            left: 40%;
        }

        .chat-area {
            height: calc(100vh - 180px);
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 75%;
            padding: 16px 20px;
            margin-bottom: 18px;
            border-radius: 15px;

            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: break-word;

            font-size: 16px;
        }

        .bot-message {
            background: #1b1b1b;
            margin-right: auto;

            line-height: 1.8;
            white-space: pre-wrap;
        }

        .user-message {
            background: #333;
            margin-left: auto;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #111;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .message-input {
            flex: 1;
            height: 45px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #222;
            color: white;
            padding: 0 18px;
            font-size: 16px;
            outline: none;
        }

        .action-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            background: #222;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send-btn {
            background: #555;
        }
    </style>
</head>

<body>

    <header class="ebot-header">

        <button class="back-btn" onclick="goBack()">←</button>

        <div class="ebot-title">
            EPMATH-BOT🤖
        </div>

    </header>


    <main class="chat-area" id="chatArea">

        <div class="message bot-message">
            👋 Hi! I'm E-Bot. Ask me anything about mathematics!
        </div>

    </main>


    <div class="input-area">

        <button class="action-btn" id="pictureBtn">
            📷
        </button>

        <button class="action-btn" id="micBtn">
            🎤
        </button>

        <input
            type="text"
            class="message-input"
            id="messageInput"
            placeholder="Ask a math question..."
        >

        <button
            class="action-btn send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>


<script>

function goBack() {
    window.location.href = "index.html";
}


const input = document.getElementById("messageInput");
const chatArea = document.getElementById("chatArea");
const pictureBtn = document.getElementById("pictureBtn");
const micBtn = document.getElementById("micBtn");


let conversationHistory = [];



// =============================
// SEND TEXT / IMAGE TO E-BOT
// =============================

async function sendMessage(
    question = null,
    imageData = null,
    mimeType = null
) {

    const message = question !== null
        ? question.trim()
        : input.value.trim();


    if (message === "" && !imageData) {
        return;
    }



    // =============================
    // SHOW USER TEXT
    // =============================

    if (message !== "") {

        const userMessage =
            document.createElement("div");

        userMessage.className =
            "message user-message";

        userMessage.textContent = message;

        chatArea.appendChild(userMessage);
    }



    input.value = "";



    // =============================
    // SHOW USER IMAGE
    // =============================

    if (imageData) {

        const imageMessage =
            document.createElement("div");

        imageMessage.className =
            "message user-message";


        const img =
            document.createElement("img");


        img.src =
            "data:" +
            mimeType +
            ";base64," +
            imageData;


        img.style.maxWidth = "250px";
        img.style.maxHeight = "250px";
        img.style.borderRadius = "10px";


        imageMessage.appendChild(img);

        chatArea.appendChild(imageMessage);
    }



    // =============================
    // THINKING MESSAGE
    // =============================

    const botMessage =
        document.createElement("div");

    botMessage.className =
        "message bot-message";

    botMessage.textContent =
        "🤔 E-Bot is thinking...";


    chatArea.appendChild(botMessage);

    chatArea.scrollTop =
        chatArea.scrollHeight;



    try {

        const response =
            await fetch(
                "/.netlify/functions/ask-ai",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        question: message,

                        image: imageData,

                        mimeType: mimeType,

                        history:
                            conversationHistory

                    })
                }
            );



        // =============================
        // GET AI RESPONSE
        // =============================

        const data =
            await response.json();



        if (data.answer) {

            botMessage.textContent =
                data.answer;



            // =============================
            // SAVE USER MESSAGE
            // TEXT + IMAGE TOGETHER
            // =============================

            conversationHistory.push({

                role: "user",

                text: message,

                image:
                    imageData || null,

                mimeType:
                    mimeType || null

            });



            // =============================
            // SAVE E-BOT'S ANSWER
            // =============================

            conversationHistory.push({

                role: "model",

                text: data.answer

            });



            // =============================
            // KEEP MEMORY MANAGEABLE
            // =============================

            if (conversationHistory.length > 10) {

                conversationHistory =
                    conversationHistory.slice(-10);

            }


        } else {

            console.error(
                "E-Bot error:",
                data
            );


            botMessage.textContent =
                "❌ Sorry, I couldn't solve that.";

        }


    } catch (error) {

        console.error(
            "Connection error:",
            error
        );


        botMessage.textContent =
            "❌ E-Bot couldn't connect right now.";

    }


    chatArea.scrollTop =
        chatArea.scrollHeight;

}



// =============================
// ENTER KEY
// =============================

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);



// =============================
// PICTURE BUTTON
// =============================

pictureBtn.addEventListener(
    "click",
    function() {

        const fileInput =
            document.createElement("input");


        fileInput.type = "file";

        fileInput.accept =
            "image/*";


        fileInput.onchange =
            function(event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }



                // Make sure it is an image

                if (!file.type.startsWith("image/")) {

                    alert(
                        "Please select an image."
                    );

                    return;
                }



                const reader =
                    new FileReader();



                reader.onload =
                    function() {

                        const base64 =
                            reader.result
                                .split(",")[1];



                        sendMessage(

                            "Solve the math problem in this image. Show me the steps.",

                            base64,

                            file.type

                        );

                    };



                reader.readAsDataURL(file);

            };


        fileInput.click();

    }
);



// =============================
// MICROPHONE BUTTON
// =============================

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;



if (SpeechRecognition) {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    micBtn.addEventListener(
        "click",
        function() {

            try {

                recognition.start();

                micBtn.textContent =
                    "🔴";

                micBtn.title =
                    "Listening...";

            } catch (error) {

                console.log(
                    "Microphone already running."
                );

            }

        }
    );



    recognition.onresult =
        function(event) {

            const spokenText =
                event.results[0][0]
                    .transcript;


            input.value =
                spokenText;


            sendMessage(
                spokenText
            );

        };



    recognition.onend =
        function() {

            micBtn.textContent =
                "🎤";

            micBtn.title =
                "Voice input";

        };



    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );


            micBtn.textContent =
                "🎤";


            micBtn.title =
                "Voice input";



            if (
                event.error ===
                "not-allowed"
            ) {

                alert(
                    "Please allow microphone access for E-Bot."
                );

            }

        };


} else {

    micBtn.addEventListener(
        "click",
        function() {

            alert(
                "Voice input is not supported by this browser. Try Google Chrome or Microsoft Edge."
            );

        }
    );

}

</script>

</body>
</html>
