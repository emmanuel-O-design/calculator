    <div class="calculator" >
        <div class="container">
        <div class="row">
        <div class="col">
    <input type="text" id="display" readonly>
            <div class="row">
                <div class="col bg-black">
    <button onclick="cleardisply()" id="btn-c">c</button>
        </div>
</div>
    <button onclick="appendvalue('+')" id="btnforplus">+</button>
    <button onclick="appendvalue('-')" id="btn-">-</button>
    <button onclick="appendvalue('/')" id="btnfordiv">/</button>
    <button onclick="appendvalue('*')" id="btnformul">x</button>
    <button onclick="deletelast()" id="btn-del">del</button>
    <button onclick="appendvalue('1')" id="btn-1">1</button>
    <button onclick="appendvalue('2')" id="btn-2">2</button>
    <button onclick="appendvalue('3')" id="btn-3">3</button>
    <button onclick="appendvalue('4')" id="btn-4">4</button>
    <button onclick="appendvalue('5')" id="btn-5">5</button>
    <button onclick="appendvalue('6')" id="btn-6">6</button>
    <button onclick="appendvalue('7')" id="btn-7">7</button>
    <button onclick="appendvalue('8')" id="btn-8">8</button>
    <button onclick="appendvalue('9')" id="btn-9">9</button>
    <button onclick="appendvalue('0')" id="btn-0">0</button>
    <button onclick="calculate()" id="btnforeq">=</button>
        </div>   
</div>

    <script>
        const display = document.getElementById("display")
        function deletelast(){
            display.value= display.value.slice(0,-1)
        }

        function appendvalue(value){
            display.value += value
        }

        function cleardisply() {
            display.value = ""
         
        }

        function calculate() {
    display.value = eval(display.value);
        }
        </script>
